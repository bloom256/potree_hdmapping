<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer</title>

	<link rel="stylesheet" type="text/css" href="./build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./libs/copc/index.js"></script>
	<script src="./build/potree/potree.js"></script>
	<script src="./libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('./build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<div style="
		position: absolute; bottom: 10px; left: 10px; z-index: 1000;
		background: rgba(0,0,0,0.7); color: #0f0; padding: 6px 10px;
		border-radius: 4px; font: 13px monospace;
		cursor: text; user-select: text;
	">
		<div id="clicked_display"></div>
		<div id="camera_display">camera coordinate: [-, -, -]</div>
		<div id="flags_display"></div>
	</div>

	<div id="controls_hint" style="
		position: absolute; top: 10px; right: 10px; z-index: 1000;
		background: rgba(0,0,0,0.6); color: #ccc; padding: 8px 12px;
		border-radius: 4px; font: 12px monospace; line-height: 1.6;
		pointer-events: none; user-select: none;
	">
		WASD &mdash; Move<br>
		Arrows &mdash; Look<br>
		Space/Shift &mdash; Up/Down<br>
		LMB drag &mdash; Rotate<br>
		RMB drag &mdash; Pan<br>
		Scroll &mdash; Speed<br>
		DblClick &mdash; Teleport<br>
		MMB &mdash; Pick point<br>
		MMB drag &mdash; Measure<br>
		Alt+MMB &mdash; Place flag<br>
		Esc &mdash; Clear
		<div style="margin-top: 6px; pointer-events: auto;">
			<input id="goto_input" type="text" placeholder="x, y, z" style="
				width: 130px; padding: 3px 6px; font: 12px monospace;
				background: #223; color: #fff; border: 1px solid #668;
				border-radius: 3px;
			">
			<button id="goto_btn" style="
				cursor: pointer;
				background: #446; color: #fff; border: 1px solid #668;
				border-radius: 3px; padding: 3px 8px; font: 12px monospace;
			">Go</button>
		</div>
		<div style="margin-top: 4px;">
			<button id="route_fly_btn" style="
				pointer-events: auto; cursor: pointer;
				background: #446; color: #fff; border: 1px solid #668;
				border-radius: 3px; padding: 4px 10px; font: 12px monospace;
				display: none;
			">Route Fly</button>
			<button id="copy_flags_btn" style="
				pointer-events: auto; cursor: pointer;
				background: #446; color: #fff; border: 1px solid #668;
				border-radius: 3px; padding: 4px 10px; font: 12px monospace;
				display: none;
			">Copy Flags</button>
		</div>
	</div>

	<script type="module">

	import * as THREE from "./libs/three.js/build/three.module.js";
	import {LineSegmentsGeometry} from "./libs/three.js/lines/LineSegmentsGeometry.js";
	import {LineSegments2} from "./libs/three.js/lines/LineSegments2.js";
	import {LineMaterial} from "./libs/three.js/lines/LineMaterial.js";

		var getQueryParam = function(name) {
			name = name.replace(/[\[\]]/g, "\\$&");
			var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
				results = regex.exec(window.location.href);
			if (!results || !results[2]) return null;
			return decodeURIComponent(results[2].replace(/\+/g, " "));
		}

		var pcFile = getQueryParam('pc') || 'data/metadata.json';
		var trjFile = getQueryParam('trj') || '';
		var posesAfterFile = getQueryParam('poses_after_lc') || '';
		var lcEdgesFile = getQueryParam('lc_edges') || '';

		// Build RGB coordinate axes for an array of poses using fat lines.
		// poses: [{matrix: [16 floats]}, ...] (row-major 4x4)
		// size: axis length in world units
		// Returns a THREE.Group with 3 LineSegments2 children (R, G, B).
		function buildPoseAxes(poses, size) {
			var axisConfigs = [
				{ color: 0xff0000, col: [0, 4, 8]  },  // X axis — Red
				{ color: 0x00ff00, col: [1, 5, 9]  },  // Y axis — Green
				{ color: 0x0000ff, col: [2, 6, 10] },  // Z axis — Blue
			];

			var group = new THREE.Group();

			for (var a = 0; a < axisConfigs.length; a++) {
				var cfg = axisConfigs[a];
				var positions = new Float32Array(poses.length * 6); // 2 verts * 3 components per pose

				for (var i = 0; i < poses.length; i++) {
					var m = poses[i].matrix;
					var px = m[3], py = m[7], pz = m[11];
					var dx = m[cfg.col[0]], dy = m[cfg.col[1]], dz = m[cfg.col[2]];
					var base = i * 6;
					positions[base]     = px;
					positions[base + 1] = py;
					positions[base + 2] = pz;
					positions[base + 3] = px + dx * size;
					positions[base + 4] = py + dy * size;
					positions[base + 5] = pz + dz * size;
				}

				var geometry = new LineSegmentsGeometry();
				geometry.setPositions(positions);

				var mat = new LineMaterial({
					color: cfg.color,
					linewidth: 2,
					resolution: new THREE.Vector2(1000, 1000),
				});

				group.add(new LineSegments2(geometry, mat));
			}

			return group;
		}

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.loadSettingsFromURL();
		viewer.setEDLEnabled(true);
		viewer.setFOV(110);
		viewer.setPointBudget(10_000_000);
		Potree.maxNodesLoading = 32;
		viewer.setControls(viewer.fpControls);
		viewer.fpControls.lockElevation = true;
		viewer.useHQ = true;

		viewer.setDescription("Loading point cloud...");

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
		});

		Potree.loadPointCloud(pcFile, "pointcloud", function(e) {
			var pointcloud = e.pointcloud;
			viewer.scene.addPointCloud(pointcloud);

			var material = pointcloud.material;
			material.activeAttributeName = "intensity gradient";
			material.gradient = Potree.Gradients.VIRIDIS;
			material.intensityGamma = 0.3;
			material.intensityBrightness = 0.1;
			material.intensityContrast = 0.0;
			material.size = 0.1;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

			viewer.fitToScreen(0.005);
			viewer.setControls(viewer.fpControls);
			viewer.setMoveSpeed(3);

			// Coordinate display
			var renderArea = document.getElementById('potree_render_area');
			var clickedDisplay = document.getElementById('clicked_display');
			var cameraDisplay = document.getElementById('camera_display');
			var flagsDisplay = document.getElementById('flags_display');
			var copyFlagsBtn = document.getElementById('copy_flags_btn');
			var markerA = null;
			var markerB = null;
			var measureLine = null;

			// Flag bookmarks
			var flags = [];

			function makeMarker(color) {
				var geo = new THREE.SphereGeometry(0.05, 16, 16);
				var mat = new THREE.MeshBasicMaterial({ color: color });
				var mesh = new THREE.Mesh(geo, mat);
				viewer.scene.scene.add(mesh);
				return mesh;
			}

			function pickPoint(event) {
				var rect = renderArea.getBoundingClientRect();
				var mouse = { x: event.clientX - rect.left, y: event.clientY - rect.top };
				var result = Potree.Utils.getMousePointCloudIntersection(
					mouse, viewer.scene.getActiveCamera(), viewer, viewer.scene.pointclouds);
				return result ? result.location : null;
			}

			function formatCoord(p) {
				return p.x.toFixed(3) + ', ' + p.y.toFixed(3) + ', ' + p.z.toFixed(3);
			}

			function createFlag(position) {
				var index = flags.length + 1;
				var group = new THREE.Group();

				var geo = new THREE.SphereGeometry(0.08, 16, 16);
				var mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
				var sphere = new THREE.Mesh(geo, mat);
				group.add(sphere);

				var label = new Potree.TextSprite("" + index);
				label.setTextColor({r: 255, g: 255, b: 255, a: 1.0});
				label.setBorderColor({r: 255, g: 0, b: 0, a: 0.8});
				label.setBackgroundColor({r: 128, g: 0, b: 0, a: 0.6});
				label.position.set(0, 0.15, 0);
				group.add(label);

				group.position.copy(position);
				viewer.scene.scene.add(group);

				flags.push({ position: position.clone(), marker: group, index: index });
				updateFlagsDisplay();
			}

			function updateFlagsDisplay() {
				if (flags.length === 0) {
					flagsDisplay.textContent = '';
					copyFlagsBtn.style.display = 'none';
					return;
				}
				var lines = ['Flags: ' + flags.length];
				for (var i = 0; i < flags.length; i++) {
					var p = flags[i].position;
					lines.push(flags[i].index + ': [' + formatCoord(p) + ']');
				}
				flagsDisplay.textContent = lines.join('\n');
				flagsDisplay.style.whiteSpace = 'pre';
				copyFlagsBtn.style.display = 'inline-block';
			}

			function clearFlags() {
				for (var i = 0; i < flags.length; i++) {
					viewer.scene.scene.remove(flags[i].marker);
				}
				flags = [];
				updateFlagsDisplay();
			}

			function clearMeasurement() {
				if (markerA) { viewer.scene.scene.remove(markerA); markerA = null; }
				if (markerB) { viewer.scene.scene.remove(markerB); markerB = null; }
				if (measureLine) { viewer.scene.scene.remove(measureLine); measureLine = null; }
				clickedDisplay.textContent = '';
			}

			// MMB click = pick point, MMB drag = measure distance, Alt+MMB = place flag
			var mmbStart = null;  // {point, screenX, screenY, altKey}
			renderArea.addEventListener('mousedown', function(event) {
				if (event.button !== 1) return;
				event.preventDefault();
				var p = pickPoint(event);
				if (!p) return;
				mmbStart = { point: p.clone(), screenX: event.clientX, screenY: event.clientY, altKey: event.altKey };
			});

			renderArea.addEventListener('mouseup', function(event) {
				if (event.button !== 1 || !mmbStart) return;
				var pA = mmbStart.point;
				var dx = event.clientX - mmbStart.screenX;
				var dy = event.clientY - mmbStart.screenY;
				var screenDist = Math.sqrt(dx * dx + dy * dy);
				var wasAlt = mmbStart.altKey;
				mmbStart = null;

				if (wasAlt && screenDist < 5) {
					// Alt+MMB click — place flag
					createFlag(pA);
					return;
				}

				if (screenDist < 5) {
					// Click (no drag) — pick point
					clearMeasurement();
					markerA = makeMarker(0xff0000);
					markerA.position.copy(pA);
					clickedDisplay.textContent = 'picked: [' + formatCoord(pA) + ']';
				} else {
					// Drag — measure distance
					var pB = pickPoint(event);
					if (!pB) return;

					clearMeasurement();
					markerA = makeMarker(0xff0000);
					markerA.position.copy(pA);
					markerB = makeMarker(0xff0000);
					markerB.position.copy(pB);

					var lineGeo = new THREE.BufferGeometry().setFromPoints([pA, pB]);
					var lineMat = new THREE.LineBasicMaterial({ color: 0xffff00 });
					measureLine = new THREE.Line(lineGeo, lineMat);
					viewer.scene.scene.add(measureLine);

					var dist = pA.distanceTo(pB);
					clickedDisplay.textContent =
						'A: [' + formatCoord(pA) + ']  ' +
						'B: [' + formatCoord(pB) + ']  ' +
						'dist: ' + dist.toFixed(3) + 'm';
				}
			});

			// Escape to clear measurement and flags
			document.addEventListener('keydown', function(event) {
				if (event.key === 'Escape') {
					clearMeasurement();
					clearFlags();
				}
			});

			// Go to coordinate
			var gotoInput = document.getElementById('goto_input');
			var gotoBtn = document.getElementById('goto_btn');
			function goToCoord() {
				var val = gotoInput.value.trim();
				var parts = val.replace(/[\[\]]/g, '').split(/[,\s]+/).map(Number);
				if (parts.length >= 3 && parts.every(isFinite)) {
					viewer.scene.view.position.set(parts[0], parts[1], parts[2]);
					gotoInput.style.borderColor = '#668';
				} else {
					gotoInput.style.borderColor = '#f44';
					gotoInput.value = '';
					gotoInput.placeholder = 'format: x, y, z';
				}
			}
			gotoBtn.addEventListener('click', goToCoord);
			gotoInput.addEventListener('keydown', function(e) {
				e.stopPropagation();
				if (e.key === 'Enter') goToCoord();
			});

			// Copy flags to clipboard
			copyFlagsBtn.addEventListener('click', function() {
				if (flags.length === 0) return;
				var lines = [];
				for (var i = 0; i < flags.length; i++) {
					var p = flags[i].position;
					lines.push(flags[i].index + ': ' + formatCoord(p));
				}
				navigator.clipboard.writeText(lines.join('\n'));
				copyFlagsBtn.textContent = 'Copied!';
				setTimeout(function() { copyFlagsBtn.textContent = 'Copy Flags'; }, 1500);
			});

			// Update camera coordinate continuously
			function updateCameraDisplay() {
				var cam = viewer.scene.getActiveCamera().position;
				cameraDisplay.textContent = 'camera coordinate: [' + formatCoord(cam) + ']';
				requestAnimationFrame(updateCameraDisplay);
			}
			requestAnimationFrame(updateCameraDisplay);

			// Load poses (before and after loop closure)
			function fetchPoses(url, label) {
				if (!url) return Promise.resolve(null);
				return fetch(url)
					.then(function(response) {
						if (!response.ok) {
							console.warn("Poses file not found: " + url);
							return null;
						}
						return response.json();
					})
					.then(function(poses) {
						if (!poses || poses.length === 0) return null;
						console.log(label + " loaded: " + poses.length + " poses");
						return poses;
					})
					.catch(function(err) {
						console.warn("Failed to load " + label + ": " + err);
						return null;
					});
			}

			// Build filename → position lookup from a poses array
			function buildPosePositionMap(poses) {
				var map = {};
				for (var i = 0; i < poses.length; i++) {
					var m = poses[i].matrix;
					map[poses[i].filename] = new THREE.Vector3(m[3], m[7], m[11]);
				}
				return map;
			}

			// Draw dashed lines between edge pairs using pose positions,
			// with numbered labels at each edge midpoint.
			function drawLCEdges(edges, posMap) {
				var positions = [];
				var midpoints = [];  // {index, midpoint} for labels
				var skipped = 0;
				for (var i = 0; i < edges.length; i++) {
					var pFrom = posMap[edges[i].from];
					var pTo = posMap[edges[i].to];
					if (!pFrom || !pTo) { skipped++; continue; }
					positions.push(pFrom.x, pFrom.y, pFrom.z, pTo.x, pTo.y, pTo.z);
					midpoints.push({
						index: i,
						pos: new THREE.Vector3(
							(pFrom.x + pTo.x) / 2,
							(pFrom.y + pTo.y) / 2,
							(pFrom.z + pTo.z) / 2)
					});
				}
				if (skipped > 0) {
					console.warn("LC edges: skipped " + skipped + " edges (pose not found)");
				}
				if (positions.length === 0) return;

				var geometry = new LineSegmentsGeometry();
				geometry.setPositions(new Float32Array(positions));

				var mat = new LineMaterial({
					color: 0xffff00,
					linewidth: 2,
					resolution: new THREE.Vector2(1000, 1000),
				});
				mat.dashed = true;
				mat.defines.USE_DASH = '';
				mat.needsUpdate = true;
				mat.dashScale = 10;
				mat.dashSize = 0.5;
				mat.gapSize = 0.2;

				var lines = new LineSegments2(geometry, mat);
				lines.computeLineDistances();
				viewer.scene.scene.add(lines);

				// Add numbered labels at edge midpoints
				for (var j = 0; j < midpoints.length; j++) {
					var label = new Potree.TextSprite("" + midpoints[j].index);
					label.setTextColor({r: 255, g: 255, b: 0, a: 1.0});
					label.setBorderColor({r: 0, g: 0, b: 0, a: 0.8});
					label.setBackgroundColor({r: 0, g: 0, b: 0, a: 0.5});
					label.position.copy(midpoints[j].pos);
					viewer.scene.scene.add(label);
				}

				console.log("LC edges drawn: " + midpoints.length + " edges with labels");
			}

			var posesAfterPromise = fetchPoses(posesAfterFile, "Poses after LC");
			var edgesPromise = (!lcEdgesFile) ? Promise.resolve(null) :
				fetch(lcEdgesFile).then(function(r) {
					if (!r.ok) { console.warn("LC edges file not found: " + lcEdgesFile); return null; }
					return r.json();
				}).catch(function(err) { console.warn("Failed to load LC edges: " + err); return null; });

			Promise.all([posesAfterPromise, edgesPromise]).then(function(results) {
				var posesAfter = results[0];
				var edges = results[1];
				if (posesAfter) {
					viewer.scene.scene.add(buildPoseAxes(posesAfter, 0.3));
				}
				if (edges && edges.length > 0 && posesAfter) {
					drawLCEdges(edges, buildPosePositionMap(posesAfter));
				} else if (edges && !posesAfter) {
					console.warn("LC edges loaded but no poses_after_lc to resolve positions");
				}
			});

			// Load trajectory overlay
			if (!trjFile) return;
			fetch(trjFile)
				.then(function(response) {
					if (!response.ok) {
						console.warn("Trajectory file not found: " + trjFile);
						return null;
					}
					return response.json();
				})
				.then(function(positions) {
					if (!positions || positions.length === 0) return;

					var offsetPositions = [];
					var vertices = new Float32Array(positions.length * 3);
					for (var i = 0; i < positions.length; i++) {
						vertices[i * 3]     = positions[i][0];
						vertices[i * 3 + 1] = positions[i][1];
						vertices[i * 3 + 2] = positions[i][2];
						offsetPositions.push(new THREE.Vector3(
							positions[i][0],
							positions[i][1],
							positions[i][2]
						));
					}

					window.trajectoryPositions = offsetPositions;

					var geometry = new THREE.BufferGeometry();
					geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

					var material = new THREE.LineBasicMaterial({ color: 0xff0000 });
					var line = new THREE.Line(geometry, material);

					viewer.scene.scene.add(line);
					console.log("Trajectory loaded: " + positions.length + " points");

					// Start camera at first trajectory point
					var start = offsetPositions[0];
					viewer.scene.view.position.set(start.x, start.y, start.z + 2);

					// Show Route Fly button
					var btn = document.getElementById('route_fly_btn');
					btn.style.display = 'inline-block';

					var flying = false;
					btn.addEventListener('click', function() {
						if (!flying) {
							viewer.fpControls.startRouteFly(window.trajectoryPositions);
							btn.textContent = 'Stop Fly';
							flying = true;
						} else {
							viewer.fpControls.stopRouteFly();
							btn.textContent = 'Route Fly';
							flying = false;
						}
					});

					viewer.fpControls.addEventListener('routefly_stopped', function() {
						btn.textContent = 'Route Fly';
						flying = false;
					});
				})
				.catch(function(err) {
					console.warn("Failed to load trajectory: " + err);
				});
		});
	</script>
</body>
</html>
