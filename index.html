<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer</title>

	<link rel="stylesheet" type="text/css" href="./build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./libs/copc/index.js"></script>
	<script src="./build/potree/potree.js"></script>
	<script src="./libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('./build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<div id="coord_display" style="
		position: absolute; bottom: 10px; left: 10px; z-index: 1000;
		background: rgba(0,0,0,0.7); color: #0f0; padding: 6px 10px;
		border-radius: 4px; font: 13px monospace;
		cursor: text; user-select: text;
	">
		camera coordinate: [-, -, -]
	</div>

	<div id="controls_hint" style="
		position: absolute; top: 10px; right: 10px; z-index: 1000;
		background: rgba(0,0,0,0.6); color: #ccc; padding: 8px 12px;
		border-radius: 4px; font: 12px monospace; line-height: 1.6;
		pointer-events: none; user-select: none;
	">
		WASD &mdash; Move<br>
		Arrows &mdash; Look<br>
		Space/Shift &mdash; Up/Down<br>
		LMB drag &mdash; Rotate<br>
		RMB drag &mdash; Pan<br>
		Scroll &mdash; Speed<br>
		DblClick &mdash; Measure<br>
		Esc &mdash; Clear measure
		<div style="margin-top: 6px;">
			<button id="route_fly_btn" style="
				pointer-events: auto; cursor: pointer;
				background: #446; color: #fff; border: 1px solid #668;
				border-radius: 3px; padding: 4px 10px; font: 12px monospace;
				display: none;
			">Route Fly</button>
		</div>
	</div>

	<script type="module">

	import * as THREE from "./libs/three.js/build/three.module.js";

		var getQueryParam = function(name) {
			name = name.replace(/[\[\]]/g, "\\$&");
			var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
				results = regex.exec(window.location.href);
			if (!results || !results[2]) return null;
			return decodeURIComponent(results[2].replace(/\+/g, " "));
		}

		var pcFile = getQueryParam('pc') || 'data/metadata.json';
		var trjFile = getQueryParam('trj') || '';

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.loadSettingsFromURL();
		viewer.setEDLEnabled(true);
		viewer.setFOV(110);
		viewer.setPointBudget(10_000_000);
		viewer.setControls(viewer.fpControls);
		viewer.fpControls.lockElevation = true;
		viewer.useHQ = true;

		viewer.setDescription("Loading point cloud...");

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
		});

		Potree.loadPointCloud(pcFile, "pointcloud", function(e) {
			var pointcloud = e.pointcloud;
			viewer.scene.addPointCloud(pointcloud);

			let material = pointcloud.material;
			material.activeAttributeName = "intensity gradient";
			material.gradient = Potree.Gradients.VIRIDIS;
			material.intensityGamma = 0.3;
			material.intensityBrightness = 0.1;
			material.intensityContrast = 0.0;
			material.size = 0.1;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

			viewer.fitToScreen(0.005);
			viewer.setControls(viewer.fpControls);
			viewer.setMoveSpeed(3);

			// Coordinate display
			var renderArea = document.getElementById('potree_render_area');
			var coordDisplay = document.getElementById('coord_display');
			var lastClickedText = '';
			var markerA = null;
			var markerB = null;
			var measureLine = null;
			var prevPoint = null;

			function makeMarker(color) {
				var geo = new THREE.SphereGeometry(0.05, 16, 16);
				var mat = new THREE.MeshBasicMaterial({ color: color });
				var mesh = new THREE.Mesh(geo, mat);
				viewer.scene.scene.add(mesh);
				return mesh;
			}

			// Double-click to measure point coordinate and distance
			renderArea.addEventListener('dblclick', function(event) {
				var rect = renderArea.getBoundingClientRect();
				var mouse = { x: event.clientX - rect.left, y: event.clientY - rect.top };
				var result = Potree.Utils.getMousePointCloudIntersection(
					mouse, viewer.scene.getActiveCamera(), viewer, viewer.scene.pointclouds);
				if (result) {
					var p = result.location;
					lastClickedText = 'clicked coordinate: [' + p.x.toFixed(3) + ', ' + p.y.toFixed(3) + ', ' + p.z.toFixed(3) + ']';

					if (prevPoint) {
						var dist = prevPoint.distanceTo(p);
						lastClickedText += '  distance: ' + dist.toFixed(3) + 'm';

						// Move marker B
						if (!markerB) { markerB = makeMarker(0xff0000); }
						markerB.position.copy(p);

						// Draw/update line between A and B
						if (measureLine) { viewer.scene.scene.remove(measureLine); }
						var lineGeo = new THREE.BufferGeometry().setFromPoints([prevPoint.clone(), p.clone()]);
						var lineMat = new THREE.LineBasicMaterial({ color: 0xffff00 });
						measureLine = new THREE.Line(lineGeo, lineMat);
						viewer.scene.scene.add(measureLine);
					}

					// Place/move marker A
					if (!markerA) { markerA = makeMarker(0xff0000); }
					if (prevPoint) {
						markerA.position.copy(prevPoint);
					} else {
						markerA.position.copy(p);
					}

					prevPoint = p.clone();
				}
			});

			// Escape to clear measurement
			document.addEventListener('keydown', function(event) {
				if (event.key === 'Escape') {
					if (markerA) { viewer.scene.scene.remove(markerA); markerA = null; }
					if (markerB) { viewer.scene.scene.remove(markerB); markerB = null; }
					if (measureLine) { viewer.scene.scene.remove(measureLine); measureLine = null; }
					prevPoint = null;
					lastClickedText = '';
				}
			});

			// Update camera coordinate continuously
			function updateCoordDisplay() {
				var cam = viewer.scene.getActiveCamera().position;
				var html = '';
				if (lastClickedText) {
					html += lastClickedText + '<br>';
				}
				html += 'camera coordinate: [' + cam.x.toFixed(3) + ', ' + cam.y.toFixed(3) + ', ' + cam.z.toFixed(3) + ']';
				coordDisplay.innerHTML = html;
				requestAnimationFrame(updateCoordDisplay);
			}
			requestAnimationFrame(updateCoordDisplay);

			// Load trajectory overlay
			if (!trjFile) return;
			fetch(trjFile)
				.then(function(response) {
					if (!response.ok) {
						console.warn("Trajectory file not found: " + trjFile);
						return null;
					}
					return response.json();
				})
				.then(function(positions) {
					if (!positions || positions.length === 0) return;

					var offsetPositions = [];
					var vertices = new Float32Array(positions.length * 3);
					for (var i = 0; i < positions.length; i++) {
						vertices[i * 3]     = positions[i][0];
						vertices[i * 3 + 1] = positions[i][1];
						vertices[i * 3 + 2] = positions[i][2];
						offsetPositions.push(new THREE.Vector3(
							positions[i][0],
							positions[i][1],
							positions[i][2]
						));
					}

					window.trajectoryPositions = offsetPositions;

					var geometry = new THREE.BufferGeometry();
					geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

					var material = new THREE.LineBasicMaterial({ color: 0xff0000 });
					var line = new THREE.Line(geometry, material);

					viewer.scene.scene.add(line);
					console.log("Trajectory loaded: " + positions.length + " points");

					// Start camera at first trajectory point
					var start = offsetPositions[0];
					viewer.scene.view.position.set(start.x, start.y, start.z + 2);

					// Show Route Fly button
					var btn = document.getElementById('route_fly_btn');
					btn.style.display = 'inline-block';

					var flying = false;
					btn.addEventListener('click', function() {
						if (!flying) {
							viewer.fpControls.startRouteFly(window.trajectoryPositions);
							btn.textContent = 'Stop Fly';
							flying = true;
						} else {
							viewer.fpControls.stopRouteFly();
							btn.textContent = 'Route Fly';
							flying = false;
						}
					});

					viewer.fpControls.addEventListener('routefly_stopped', function() {
						btn.textContent = 'Route Fly';
						flying = false;
					});
				})
				.catch(function(err) {
					console.warn("Failed to load trajectory: " + err);
				});
		});
	</script>
</body>
</html>
